name: keep-backend-awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Keep the backend awake
        run: |
          URL="https://dvein-backend.onrender.com/api/v1/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "$(date -u +%H:%M:%S) ping $i -> HTTP $code"
            if [ "$i" -lt 5 ]; then sleep 55; fi
          done
