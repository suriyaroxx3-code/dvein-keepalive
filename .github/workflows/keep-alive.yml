name: keep-backend-awake

# Keeps the free DVEIN Monitor backend from going to sleep. GitHub's scheduler alone runs this only every few hours, so
# a run stays alive for ~5h40m pinging every 3 minutes and then starts the next run itself. The cron line is a backup
# that restarts the chain if it ever breaks. Only one run is active at a time (see concurrency).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping every 3 minutes for about 5h40m
        run: |
          URL="https://dvein-backend.onrender.com/api/v1/health?src=keepalive"
          END=$(( $(date +%s) + 20400 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 100 "$URL" || echo 000)
            echo "$(date -u +%H:%M:%S) -> HTTP $code"
            sleep 170
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep-alive.yml --repo "${{ github.repository }}"
